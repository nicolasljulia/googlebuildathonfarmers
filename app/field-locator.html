<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GCropUp</title>
<style>
  :root {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --text: #1c1c1e;
    --text-dim: #6e6e73;
    --accent: #2e7d32;
    --accent-dark: #1b5e20;
    --border: #d1d1d6;
    --danger: #d32f2f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --surface: #1c1c1e;
      --text: #f5f5f7;
      --text-dim: #98989d;
      --accent: #43a047;
      --accent-dark: #2e7d32;
      --border: #38383a;
      --danger: #ef5350;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --surface: #1c1c1e;
    --text: #f5f5f7;
    --text-dim: #98989d;
    --accent: #43a047;
    --accent-dark: #2e7d32;
    --border: #38383a;
    --danger: #ef5350;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow-x: hidden;
  }

  .screen {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 20px) 20px calc(20px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }

  header { text-align: center; padding: 10px 0 4px; flex: 0 0 auto; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { font-size: 13px; color: var(--text-dim); margin: 0; }

  .stage {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  .stage[hidden] { display: none; }

  .crop-step {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: stretch;
  }
  .crop-step[hidden] { display: none; }
  .crop-step .icon {
    font-size: 48px;
    text-align: center;
  }
  .crop-step label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
  }
  select, .crop-input {
    width: 100%;
    padding: 14px 14px;
    font-size: 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
  }
  select:focus, .crop-input:focus { outline: 2px solid var(--accent); }
  .crop-input {
    display: none;
  }
  .crop-input.visible { display: block; }
  .continue-btn {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  .continue-btn:disabled { opacity: 0.4; }
  .continue-btn:active:not(:disabled) { opacity: 0.8; }
  .continue-btn.secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .crop-chip-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 4px;
  }
  .crop-chip-row .crop-name { font-weight: 600; font-size: 14px; }
  .crop-chip-row .change-link {
    background: none; border: none; color: var(--accent);
    font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px;
  }

  .locate-btn {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 20px;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  .locate-btn:active { transform: scale(0.96); background: var(--accent-dark); }
  .locate-btn:disabled { opacity: 0.6; }
  .locate-btn svg { width: 48px; height: 48px; }

  .pulse {
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(46,125,50,0.5); }
    70% { box-shadow: 0 0 0 30px rgba(46,125,50,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,125,50,0); }
  }

  .hint { font-size: 14px; color: var(--text-dim); text-align: center; max-width: 260px; }

  .status { font-size: 14px; color: var(--text-dim); text-align: center; min-height: 20px; }
  .status.error { color: var(--danger); }

  .result-card {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .result-card.visible { display: flex; }

  .coord-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 15px;
  }
  .coord-row .label { color: var(--text-dim); font-size: 13px; }
  .coord-row .value { font-weight: 600; font-variant-numeric: tabular-nums; }

  .accuracy-note {
    font-size: 12.5px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(255, 179, 0, 0.15);
    color: #a86a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .accuracy-note { color: #ffca7a; }
  }
  :root[data-theme="dark"] .accuracy-note { color: #ffca7a; }
  .accuracy-note.good {
    background: rgba(76, 175, 80, 0.15);
    color: #2e7d32;
  }

  .actions { display: flex; gap: 10px; margin-top: 4px; }
  .action-btn {
    flex: 1;
    padding: 12px 10px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .action-btn.primary {
    background: var(--accent);
    color: white;
    border: none;
  }
  .action-btn:active { opacity: 0.7; }

  .copied-toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: white;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .copied-toast.show { opacity: 1; }

  footer { flex: 0 0 auto; text-align: center; padding-top: 8px; }
  .again-link {
    background: none; border: none; color: var(--accent);
    font-size: 14px; font-weight: 600; cursor: pointer; padding: 8px;
  }

  .menu-option {
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .menu-option:active { opacity: 0.7; }

  .result-text {
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="screen">
  <header>
    <h1>📍 GCropUp</h1>
    <p id="tagline">Walk to the middle of the field, then tap the button</p>
  </header>

  <div class="crop-step" id="cropStep">
    <div class="icon">🌾</div>
    <div>
      <label for="cropSelect">What's growing in this field?</label>
      <select id="cropSelect">
        <option value="">Select a crop…</option>
        <option>Corn</option>
        <option>Soybeans</option>
        <option>Wheat</option>
        <option>Alfalfa</option>
        <option>Cotton</option>
        <option>Rice</option>
        <option>Barley</option>
        <option>Oats</option>
        <option>Sorghum</option>
        <option>Hay / Pasture</option>
        <option value="__other__">Other…</option>
      </select>
      <input type="text" class="crop-input" id="cropOther" placeholder="Type the crop name">
    </div>
    <button class="continue-btn" id="cropContinueBtn" disabled>Continue</button>
  </div>

  <div class="crop-step" id="onFieldStep" hidden>
    <div class="icon">🚜</div>
    <div class="crop-chip-row">
      <span class="crop-name">🌱 <span id="cropDisplayOnField"></span></span>
      <button class="change-link" id="changeCropFromOnFieldBtn">Change</button>
    </div>
    <label>Are you on your field right now?</label>
    <button class="continue-btn" id="onFieldYesBtn">Yes — use my location</button>
    <button class="continue-btn secondary" id="onFieldNoBtn">No — I'll enter coordinates</button>
  </div>

  <div class="crop-step" id="manualCoordsStep" hidden>
    <div class="icon">📌</div>
    <label>Drop a pin — enter your field's coordinates</label>
    <input type="number" step="any" class="crop-input visible" id="manualLat" placeholder="Latitude (e.g. 36.6002)">
    <input type="number" step="any" class="crop-input visible" id="manualLon" placeholder="Longitude (e.g. -121.1015)">
    <button class="continue-btn" id="manualCoordsContinueBtn" disabled>Use these coordinates</button>
    <button class="continue-btn secondary" id="manualCoordsBackBtn">Back</button>
  </div>

  <div class="stage" id="stage" hidden>
    <div class="crop-chip-row">
      <span class="crop-name">🌱 <span id="cropDisplay"></span></span>
      <button class="change-link" id="changeCropBtn">Change</button>
    </div>
    <button class="locate-btn" id="locateBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        <circle cx="12" cy="12" r="8"/>
      </svg>
      <span id="btnLabel">Mark This Spot</span>
    </button>

    <div class="status" id="status"></div>

    <div class="result-card" id="resultCard">
      <div class="coord-row">
        <span class="label">Crop</span>
        <span class="value" id="cropVal">—</span>
      </div>
      <div class="coord-row">
        <span class="label">Latitude</span>
        <span class="value" id="latVal">—</span>
      </div>
      <div class="coord-row">
        <span class="label">Longitude</span>
        <span class="value" id="lonVal">—</span>
      </div>
      <div class="coord-row">
        <span class="label">Accuracy</span>
        <span class="value" id="accVal">—</span>
      </div>
      <div class="coord-row">
        <span class="label">Time</span>
        <span class="value" id="timeVal">—</span>
      </div>

      <div class="accuracy-note" id="accuracyNote" style="display:none;"></div>

      <div class="actions">
        <button class="action-btn" id="copyBtn">Copy</button>
        <button class="action-btn" id="mapBtn">View on Map</button>
        <button class="action-btn" id="shareBtn">Share</button>
      </div>
      <button class="continue-btn" id="useLocationBtn">Use this location</button>
    </div>
  </div>

  <div class="crop-step" id="menuStep" hidden>
    <div class="icon">🛰️</div>
    <label id="menuLabel">What would you like to check?</label>
    <div id="menuOptions"></div>
  </div>

  <div class="crop-step" id="resultStep" hidden>
    <div class="result-card visible">
      <div class="result-text" id="resultText"></div>
    </div>
    <button class="continue-btn" id="continueYesBtn">Yes — check something else</button>
    <button class="continue-btn secondary" id="continueNoBtn">No, that's all</button>
  </div>

  <div class="crop-step" id="doneStep" hidden>
    <div class="icon">✅</div>
    <div class="result-text" id="doneText" style="text-align:center;"></div>
    <button class="continue-btn" id="startOverBtn">Start over</button>
  </div>

  <div class="status error" id="apiError"></div>

  <footer>
    <button class="again-link" id="againBtn" style="display:none;">Mark a different spot</button>
  </footer>
</div>

<div class="copied-toast" id="toast">Copied to clipboard</div>

<script>
(function () {
  const API_BASE = window.location.origin;

  const cropStep = document.getElementById('cropStep');
  const cropSelect = document.getElementById('cropSelect');
  const cropOther = document.getElementById('cropOther');
  const cropContinueBtn = document.getElementById('cropContinueBtn');
  const stage = document.getElementById('stage');
  const cropDisplay = document.getElementById('cropDisplay');
  const cropVal = document.getElementById('cropVal');
  const changeCropBtn = document.getElementById('changeCropBtn');

  const onFieldStep = document.getElementById('onFieldStep');
  const cropDisplayOnField = document.getElementById('cropDisplayOnField');
  const changeCropFromOnFieldBtn = document.getElementById('changeCropFromOnFieldBtn');
  const onFieldYesBtn = document.getElementById('onFieldYesBtn');
  const onFieldNoBtn = document.getElementById('onFieldNoBtn');

  const manualCoordsStep = document.getElementById('manualCoordsStep');
  const manualLat = document.getElementById('manualLat');
  const manualLon = document.getElementById('manualLon');
  const manualCoordsContinueBtn = document.getElementById('manualCoordsContinueBtn');
  const manualCoordsBackBtn = document.getElementById('manualCoordsBackBtn');

  const menuStep = document.getElementById('menuStep');
  const menuLabel = document.getElementById('menuLabel');
  const menuOptions = document.getElementById('menuOptions');

  const resultStep = document.getElementById('resultStep');
  const resultText = document.getElementById('resultText');
  const continueYesBtn = document.getElementById('continueYesBtn');
  const continueNoBtn = document.getElementById('continueNoBtn');

  const doneStep = document.getElementById('doneStep');
  const doneText = document.getElementById('doneText');
  const startOverBtn = document.getElementById('startOverBtn');

  const apiError = document.getElementById('apiError');
  const tagline = document.getElementById('tagline');

  let cropType = '';
  let sessionId = null;

  function showOnly(el) {
    [cropStep, onFieldStep, manualCoordsStep, stage, menuStep, resultStep, doneStep].forEach(s => {
      s.hidden = s !== el;
    });
  }

  function showApiError(msg) {
    apiError.textContent = msg;
  }
  function clearApiError() {
    apiError.textContent = '';
  }

  async function api(path, body) {
    clearApiError();
    const res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({detail: res.statusText}));
      throw new Error(err.detail || 'Request failed');
    }
    return res.json();
  }

  fetch(API_BASE + '/crops').then(r => r.json()).then(data => {
    if (!data.crops || !data.crops.length) return;
    const current = cropSelect.value;
    cropSelect.innerHTML = '<option value="">Select a crop…</option>';
    data.crops.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      cropSelect.appendChild(opt);
    });
    const otherOpt = document.createElement('option');
    otherOpt.value = '__other__';
    otherOpt.textContent = 'Other…';
    cropSelect.appendChild(otherOpt);
  }).catch(() => { /* keep the built-in short list if the API isn't reachable */ });

  function currentCropValue() {
    if (cropSelect.value === '__other__') return cropOther.value.trim();
    return cropSelect.value;
  }

  function refreshContinueEnabled() {
    cropContinueBtn.disabled = currentCropValue().length === 0;
  }

  cropSelect.addEventListener('change', () => {
    cropOther.classList.toggle('visible', cropSelect.value === '__other__');
    if (cropSelect.value === '__other__') {
      cropOther.focus();
    }
    refreshContinueEnabled();
  });
  cropOther.addEventListener('input', refreshContinueEnabled);

  cropContinueBtn.addEventListener('click', () => {
    cropType = currentCropValue();
    if (!cropType) return;
    cropDisplayOnField.textContent = cropType;
    showOnly(onFieldStep);
  });

  function backToCropStep() {
    showOnly(cropStep);
  }
  changeCropFromOnFieldBtn.addEventListener('click', backToCropStep);
  changeCropBtn.addEventListener('click', backToCropStep);

  onFieldYesBtn.addEventListener('click', () => {
    cropDisplay.textContent = cropType;
    showOnly(stage);
  });
  onFieldNoBtn.addEventListener('click', () => {
    showOnly(manualCoordsStep);
  });

  function refreshManualEnabled() {
    manualCoordsContinueBtn.disabled = manualLat.value === '' || manualLon.value === '';
  }
  manualLat.addEventListener('input', refreshManualEnabled);
  manualLon.addEventListener('input', refreshManualEnabled);
  manualCoordsBackBtn.addEventListener('click', () => showOnly(onFieldStep));
  manualCoordsContinueBtn.addEventListener('click', () => {
    const lat = parseFloat(manualLat.value);
    const lon = parseFloat(manualLon.value);
    if (Number.isNaN(lat) || Number.isNaN(lon)) return;
    beginAnalysis(false, lat, lon);
  });

  const locateBtn = document.getElementById('locateBtn');
  const btnLabel = document.getElementById('btnLabel');
  const statusEl = document.getElementById('status');
  const resultCard = document.getElementById('resultCard');
  const latVal = document.getElementById('latVal');
  const lonVal = document.getElementById('lonVal');
  const accVal = document.getElementById('accVal');
  const timeVal = document.getElementById('timeVal');
  const accuracyNote = document.getElementById('accuracyNote');
  const copyBtn = document.getElementById('copyBtn');
  const mapBtn = document.getElementById('mapBtn');
  const shareBtn = document.getElementById('shareBtn');
  const useLocationBtn = document.getElementById('useLocationBtn');
  const toast = document.getElementById('toast');
  const againBtn = document.getElementById('againBtn');

  let lastFix = null;
  let watchId = null;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function fmtCoord(n) {
    return n.toFixed(6) + '°';
  }

  function setBusy(isBusy) {
    locateBtn.disabled = isBusy;
    if (isBusy) {
      locateBtn.classList.add('pulse');
      btnLabel.textContent = 'Locating…';
    } else {
      locateBtn.classList.remove('pulse');
      btnLabel.textContent = 'Mark This Spot';
    }
  }

  function stopWatch() {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
  }

  function renderFix(pos) {
    const { latitude, longitude, accuracy } = pos.coords;
    lastFix = { latitude, longitude, accuracy, time: new Date(pos.timestamp) };

    cropVal.textContent = cropType || '—';
    latVal.textContent = fmtCoord(latitude);
    lonVal.textContent = fmtCoord(longitude);
    accVal.textContent = '± ' + Math.round(accuracy) + ' m';
    timeVal.textContent = lastFix.time.toLocaleTimeString();

    if (accuracy > 15) {
      accuracyNote.style.display = 'block';
      accuracyNote.classList.remove('good');
      accuracyNote.textContent = 'Accuracy is ' + Math.round(accuracy) + ' m — for a tighter fix, wait a few seconds under open sky and tap again.';
    } else {
      accuracyNote.style.display = 'block';
      accuracyNote.classList.add('good');
      accuracyNote.textContent = 'Good fix (± ' + Math.round(accuracy) + ' m).';
    }

    resultCard.classList.add('visible');
    againBtn.style.display = 'inline-block';
    statusEl.textContent = '';
    statusEl.classList.remove('error');
  }

  function errorMessage(err) {
    switch (err.code) {
      case err.PERMISSION_DENIED:
        return "Location access was denied. Enable location for this page in your phone's settings and try again.";
      case err.POSITION_UNAVAILABLE:
        return "Couldn't get a location fix. Make sure you're outdoors with a clear view of the sky.";
      case err.TIMEOUT:
        return "Location request timed out. Try again — it can help to hold still for a few seconds.";
      default:
        return "Something went wrong getting your location. Please try again.";
    }
  }

  function locate() {
    if (!('geolocation' in navigator)) {
      statusEl.textContent = "This browser doesn't support location. Try opening this page in a standard mobile browser (Safari or Chrome).";
      statusEl.classList.add('error');
      return;
    }

    setBusy(true);
    statusEl.textContent = 'Getting a GPS fix — hold still…';
    statusEl.classList.remove('error');
    resultCard.classList.remove('visible');
    stopWatch();

    let bestFix = null;
    let settleTimer = null;

    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        if (!bestFix || pos.coords.accuracy < bestFix.coords.accuracy) {
          bestFix = pos;
        }
        if (!settleTimer) {
          settleTimer = setTimeout(() => {
            stopWatch();
            setBusy(false);
            if (bestFix) renderFix(bestFix);
          }, 4000);
        }
      },
      (err) => {
        stopWatch();
        setBusy(false);
        statusEl.textContent = errorMessage(err);
        statusEl.classList.add('error');
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );
  }

  copyBtn.addEventListener('click', async () => {
    if (!lastFix) return;
    const text = (cropType ? cropType + ': ' : '') + lastFix.latitude.toFixed(6) + ', ' + lastFix.longitude.toFixed(6);
    try {
      await navigator.clipboard.writeText(text);
      showToast('Copied: ' + text);
    } catch (e) {
      showToast('Copy failed — coordinates: ' + text);
    }
  });

  mapBtn.addEventListener('click', () => {
    if (!lastFix) return;
    const url = 'https://www.google.com/maps?q=' + lastFix.latitude.toFixed(6) + ',' + lastFix.longitude.toFixed(6);
    window.open(url, '_blank', 'noopener');
  });

  shareBtn.addEventListener('click', async () => {
    if (!lastFix) return;
    const text = (cropType ? cropType + ' field — ' : 'Field location: ') + lastFix.latitude.toFixed(6) + ', ' + lastFix.longitude.toFixed(6);
    const url = 'https://www.google.com/maps?q=' + lastFix.latitude.toFixed(6) + ',' + lastFix.longitude.toFixed(6);
    if (navigator.share) {
      try {
        await navigator.share({ title: cropType ? cropType + ' Field Location' : 'Field Location', text, url });
      } catch (e) { }
    } else {
      try {
        await navigator.clipboard.writeText(text + ' — ' + url);
        showToast('Copied link to clipboard');
      } catch (e) {
        showToast(text);
      }
    }
  });

  useLocationBtn.addEventListener('click', () => {
    if (!lastFix) return;
    beginAnalysis(true, lastFix.latitude, lastFix.longitude);
  });

  locateBtn.addEventListener('click', locate);
  againBtn.addEventListener('click', locate);

  async function beginAnalysis(onField, lat, lon) {
    tagline.textContent = 'Running analysis…';
    try {
      const started = await api('/chat/start');
      sessionId = started.session_id;
      await api(`/chat/${sessionId}/reply`, {value: cropType});
      await api(`/chat/${sessionId}/reply`, {value: onField ? 'yes' : 'no'});
      const menuPrompt = await api(`/chat/${sessionId}/reply`, {value: {lat, lon}});
      renderServerPrompt(menuPrompt);
    } catch (e) {
      showApiError('Could not reach the analysis server: ' + e.message);
    }
  }

  function renderServerPrompt(prompt) {
    tagline.textContent = 'GCropUp';
    if (prompt.stage === 'AWAITING_FEATURE_CHOICE') {
      menuLabel.textContent = prompt.message;
      menuOptions.innerHTML = '';
      prompt.options.forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'menu-option';
        btn.textContent = o.label;
        btn.style.marginBottom = '10px';
        btn.addEventListener('click', () => sendReply(o.id));
        menuOptions.appendChild(btn);
      });
      showOnly(menuStep);
    } else if (prompt.stage === 'AWAITING_CONTINUE') {
      resultText.textContent = prompt.message.replace(/\n\nWould you like to check anything else\?$/, '');
      showOnly(resultStep);
    } else if (prompt.stage === 'DONE') {
      doneText.textContent = prompt.message;
      showOnly(doneStep);
    }
  }

  async function sendReply(value) {
    try {
      const prompt = await api(`/chat/${sessionId}/reply`, {value});
      renderServerPrompt(prompt);
    } catch (e) {
      showApiError('Request failed: ' + e.message);
    }
  }

  continueYesBtn.addEventListener('click', () => sendReply('yes'));
  continueNoBtn.addEventListener('click', () => sendReply('no'));

  startOverBtn.addEventListener('click', () => {
    cropType = '';
    sessionId = null;
    lastFix = null;
    cropSelect.value = '';
    cropOther.value = '';
    cropOther.classList.remove('visible');
    manualLat.value = '';
    manualLon.value = '';
    resultCard.classList.remove('visible');
    againBtn.style.display = 'none';
    refreshContinueEnabled();
    showOnly(cropStep);
  });
})();
</script>

</body>
</html>
