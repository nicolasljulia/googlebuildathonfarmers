<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GCropUp</title>
<style>
  :root {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --text: #1c1c1e;
    --text-dim: #6e6e73;
    --accent: #2e7d32;
    --accent-dark: #1b5e20;
    --border: #d1d1d6;
    --danger: #d32f2f;
    --bubble-bot: #ffffff;
    --bubble-user: #2e7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --surface: #1c1c1e;
      --text: #f5f5f7;
      --text-dim: #98989d;
      --accent: #43a047;
      --accent-dark: #2e7d32;
      --border: #38383a;
      --danger: #ef5350;
      --bubble-bot: #262628;
      --bubble-user: #2e7d32;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --surface: #1c1c1e;
    --text: #f5f5f7;
    --text-dim: #98989d;
    --accent: #43a047;
    --accent-dark: #2e7d32;
    --border: #38383a;
    --danger: #ef5350;
    --bubble-bot: #262628;
    --bubble-user: #2e7d32;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow-x: hidden;
  }

  .phone {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  .chat-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(env(safe-area-inset-top, 14px) + 6px) 16px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .chat-header .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    flex: 0 0 auto;
  }
  .chat-header .title { font-size: 16px; font-weight: 700; }
  .chat-header .status { font-size: 12px; color: var(--text-dim); }

  .thread {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    -webkit-overflow-scrolling: touch;
  }

  .row { display: flex; margin: 6px 0; }
  .row.bot { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }

  .bubble-wrap { max-width: 84%; display: flex; flex-direction: column; }
  .row.user .bubble-wrap { align-items: flex-end; }
  .row.bot .bubble-wrap { align-items: flex-start; }

  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.bot .bubble {
    background: var(--bubble-bot);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg-time {
    font-size: 11px;
    color: var(--text-dim);
    margin: 3px 6px 0;
  }

  .controls {
    margin-top: 8px;
    max-width: 84%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .controls.disabled { opacity: 0.45; pointer-events: none; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 16px;
    border-radius: 18px;
    border: 1.5px solid var(--accent);
    background: var(--surface);
    color: var(--accent);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .chip:active { background: var(--accent); color: white; }

  .inline-select, .inline-input {
    width: 100%;
    padding: 11px 12px;
    font-size: 15px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
  }
  .inline-select:focus, .inline-input:focus { outline: 2px solid var(--accent); }

  .inline-btn {
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .inline-btn:disabled { opacity: 0.4; }
  .inline-btn:active:not(:disabled) { opacity: 0.8; }

  .locate-row { display: flex; align-items: center; gap: 12px; }
  .locate-btn {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    cursor: pointer;
    flex: 0 0 auto;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  .locate-btn.pulse { animation: pulse 1.4s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(46,125,50,0.5); }
    70% { box-shadow: 0 0 0 18px rgba(46,125,50,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,125,50,0); }
  }
  .locate-status { font-size: 13px; color: var(--text-dim); }
  .locate-status.error { color: var(--danger); }

  .typing-bubble {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
  }
  .typing-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .composer-spacer {
    flex: 0 0 auto;
    height: calc(env(safe-area-inset-bottom, 10px) + 6px);
  }
</style>
</head>
<body>

<div class="phone">
  <div class="chat-header">
    <div class="avatar">GC</div>
    <div>
      <div class="title">GCropUp</div>
      <div class="status" id="headerStatus">Online</div>
    </div>
  </div>
  <div class="thread" id="thread"></div>
  <div class="composer-spacer"></div>
</div>

<script>
(function () {
  const API_BASE = window.location.origin;
  const thread = document.getElementById('thread');
  const headerStatus = document.getElementById('headerStatus');

  let cropType = '';
  let sessionId = null;
  let allCrops = [];

  function scrollToBottom() {
    thread.scrollTop = thread.scrollHeight;
  }

  function fmtTime() {
    return new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
  }

  function addBotBubble(text) {
    const row = document.createElement('div');
    row.className = 'row bot';
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = fmtTime();
    wrap.appendChild(bubble);
    wrap.appendChild(time);
    row.appendChild(wrap);
    thread.appendChild(row);
    scrollToBottom();
    return wrap;
  }

  function addUserBubble(text) {
    const row = document.createElement('div');
    row.className = 'row user';
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = fmtTime();
    wrap.appendChild(bubble);
    wrap.appendChild(time);
    row.appendChild(wrap);
    thread.appendChild(row);
    scrollToBottom();
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing-bubble';
    bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
    wrap.appendChild(bubble);
    row.appendChild(wrap);
    thread.appendChild(row);
    scrollToBottom();
    return row;
  }

  function removeTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function addControls(bubbleWrap) {
    const controls = document.createElement('div');
    controls.className = 'controls';
    bubbleWrap.appendChild(controls);
    return controls;
  }

  function disable(controls) {
    controls.classList.add('disabled');
  }

  async function api(path, body) {
    const res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({detail: res.statusText}));
      throw new Error(err.detail || 'Request failed');
    }
    return res.json();
  }

  function showError(msg) {
    removeTyping();
    addBotBubble('Error: ' + msg);
  }

  function askCrop() {
    const wrap = addBotBubble("Hi, I'm GCropUp. What's growing in your field?");
    const controls = addControls(wrap);

    const select = document.createElement('select');
    select.className = 'inline-select';
    const placeholder = document.createElement('option');
    placeholder.textContent = 'Select a crop…';
    placeholder.value = '';
    select.appendChild(placeholder);
    const shortList = ['Corn', 'Soybeans', 'Wheat', 'Alfalfa', 'Cotton', 'Rice', 'Barley', 'Oats', 'Sorghum', 'Hay / Pasture'];
    (allCrops.length ? allCrops : shortList).forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      select.appendChild(opt);
    });
    const otherOpt = document.createElement('option');
    otherOpt.value = '__other__';
    otherOpt.textContent = 'Other…';
    select.appendChild(otherOpt);

    const otherInput = document.createElement('input');
    otherInput.type = 'text';
    otherInput.className = 'inline-input';
    otherInput.placeholder = 'Type the crop name';
    otherInput.style.display = 'none';

    const sendBtn = document.createElement('button');
    sendBtn.className = 'inline-btn';
    sendBtn.textContent = 'Send';
    sendBtn.disabled = true;

    function currentValue() {
      if (select.value === '__other__') return otherInput.value.trim();
      return select.value;
    }
    function refresh() { sendBtn.disabled = currentValue().length === 0; }

    select.addEventListener('change', () => {
      otherInput.style.display = select.value === '__other__' ? 'block' : 'none';
      if (select.value === '__other__') otherInput.focus();
      refresh();
    });
    otherInput.addEventListener('input', refresh);

    sendBtn.addEventListener('click', () => {
      const value = currentValue();
      if (!value) return;
      cropType = value;
      disable(controls);
      addUserBubble(value);
      askOnField();
    });

    controls.appendChild(select);
    controls.appendChild(otherInput);
    controls.appendChild(sendBtn);
    scrollToBottom();
  }

  function askOnField() {
    const wrap = addBotBubble('Got it. Are you on your field right now?');
    const controls = addControls(wrap);
    const chipRow = document.createElement('div');
    chipRow.className = 'chip-row';

    const yesChip = document.createElement('button');
    yesChip.className = 'chip';
    yesChip.textContent = 'Yes, I\'m here';
    yesChip.addEventListener('click', () => {
      disable(controls);
      addUserBubble("Yes, I'm here");
      askGpsLocation();
    });

    const noChip = document.createElement('button');
    noChip.className = 'chip';
    noChip.textContent = "No, I'm not";
    noChip.addEventListener('click', () => {
      disable(controls);
      addUserBubble("No, I'm not");
      askManualLocation();
    });

    chipRow.appendChild(yesChip);
    chipRow.appendChild(noChip);
    controls.appendChild(chipRow);
    scrollToBottom();
  }

  function askGpsLocation() {
    const wrap = addBotBubble('Stand in the middle of the field, then tap the button to share your location.');
    const controls = addControls(wrap);

    const row = document.createElement('div');
    row.className = 'locate-row';
    const btn = document.createElement('button');
    btn.className = 'locate-btn';
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>';
    const status = document.createElement('div');
    status.className = 'locate-status';
    row.appendChild(btn);
    row.appendChild(status);
    controls.appendChild(row);

    let watchId = null;
    function stopWatch() {
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    }

    btn.addEventListener('click', () => {
      if (!('geolocation' in navigator)) {
        status.textContent = "This browser doesn't support location.";
        status.classList.add('error');
        return;
      }
      btn.classList.add('pulse');
      btn.disabled = true;
      status.textContent = 'Getting a GPS fix — hold still…';
      status.classList.remove('error');

      let bestFix = null;
      let settleTimer = null;
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          if (!bestFix || pos.coords.accuracy < bestFix.coords.accuracy) bestFix = pos;
          if (!settleTimer) {
            settleTimer = setTimeout(() => {
              stopWatch();
              btn.classList.remove('pulse');
              if (bestFix) {
                const { latitude, longitude, accuracy } = bestFix.coords;
                disable(controls);
                addUserBubble(`${latitude.toFixed(5)}, ${longitude.toFixed(5)} (±${Math.round(accuracy)}m)`);
                beginAnalysis(true, latitude, longitude);
              } else {
                btn.disabled = false;
                status.textContent = "Couldn't get a fix — try again.";
                status.classList.add('error');
              }
            }, 4000);
          }
        },
        (err) => {
          stopWatch();
          btn.classList.remove('pulse');
          btn.disabled = false;
          status.textContent = err.code === err.PERMISSION_DENIED
            ? 'Location access denied — enable it in settings and try again.'
            : "Couldn't get your location. Try again outdoors.";
          status.classList.add('error');
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
      );
    });

    scrollToBottom();
  }

  function askManualLocation() {
    const wrap = addBotBubble("No problem. Send me your field's coordinates.");
    const controls = addControls(wrap);

    const lat = document.createElement('input');
    lat.type = 'number'; lat.step = 'any'; lat.className = 'inline-input';
    lat.placeholder = 'Latitude (e.g. 36.6002)';
    const lon = document.createElement('input');
    lon.type = 'number'; lon.step = 'any'; lon.className = 'inline-input';
    lon.placeholder = 'Longitude (e.g. -121.1015)';
    const sendBtn = document.createElement('button');
    sendBtn.className = 'inline-btn';
    sendBtn.textContent = 'Send location';
    sendBtn.disabled = true;

    function refresh() { sendBtn.disabled = lat.value === '' || lon.value === ''; }
    lat.addEventListener('input', refresh);
    lon.addEventListener('input', refresh);

    sendBtn.addEventListener('click', () => {
      const latVal = parseFloat(lat.value), lonVal = parseFloat(lon.value);
      if (Number.isNaN(latVal) || Number.isNaN(lonVal)) return;
      disable(controls);
      addUserBubble(`${latVal}, ${lonVal}`);
      beginAnalysis(false, latVal, lonVal);
    });

    controls.appendChild(lat);
    controls.appendChild(lon);
    controls.appendChild(sendBtn);
    scrollToBottom();
  }

  async function beginAnalysis(onField, lat, lon) {
    headerStatus.textContent = 'typing…';
    addTyping();
    try {
      const started = await api('/chat/start');
      sessionId = started.session_id;
      await api(`/chat/${sessionId}/reply`, {value: cropType});
      await api(`/chat/${sessionId}/reply`, {value: onField ? 'yes' : 'no'});
      const prompt = await api(`/chat/${sessionId}/reply`, {value: {lat, lon}});
      removeTyping();
      headerStatus.textContent = 'Online';
      renderServerPrompt(prompt);
    } catch (e) {
      headerStatus.textContent = 'Online';
      showError('Could not reach the analysis server: ' + e.message);
    }
  }

  function renderServerPrompt(prompt) {
    if (prompt.stage === 'AWAITING_FEATURE_CHOICE') {
      const wrap = addBotBubble(prompt.message);
      const controls = addControls(wrap);
      const chipRow = document.createElement('div');
      chipRow.className = 'chip-row';
      prompt.options.forEach(o => {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.textContent = o.label;
        chip.addEventListener('click', () => {
          disable(controls);
          addUserBubble(o.label);
          sendReply(o.id);
        });
        chipRow.appendChild(chip);
      });
      controls.appendChild(chipRow);
      scrollToBottom();
    } else if (prompt.stage === 'AWAITING_CONTINUE') {
      const resultMsg = prompt.message.replace(/\n\nWould you like to check anything else\?$/, '');
      addBotBubble(resultMsg);
      setTimeout(() => {
        const wrap = addBotBubble('Would you like to check anything else?');
        const controls = addControls(wrap);
        const chipRow = document.createElement('div');
        chipRow.className = 'chip-row';
        const yesChip = document.createElement('button');
        yesChip.className = 'chip';
        yesChip.textContent = 'Yes';
        yesChip.addEventListener('click', () => {
          disable(controls);
          addUserBubble('Yes');
          sendReply('yes');
        });
        const noChip = document.createElement('button');
        noChip.className = 'chip';
        noChip.textContent = 'No, that\'s all';
        noChip.addEventListener('click', () => {
          disable(controls);
          addUserBubble("No, that's all");
          sendReply('no');
        });
        chipRow.appendChild(yesChip);
        chipRow.appendChild(noChip);
        controls.appendChild(chipRow);
        scrollToBottom();
      }, 350);
    } else if (prompt.stage === 'DONE') {
      addBotBubble(prompt.message);
      setTimeout(() => {
        const wrap = addBotBubble('Want to check another field?');
        const controls = addControls(wrap);
        const chipRow = document.createElement('div');
        chipRow.className = 'chip-row';
        const startOverChip = document.createElement('button');
        startOverChip.className = 'chip';
        startOverChip.textContent = 'Start over';
        startOverChip.addEventListener('click', () => {
          disable(controls);
          addUserBubble('Start over');
          cropType = '';
          sessionId = null;
          askCrop();
        });
        chipRow.appendChild(startOverChip);
        controls.appendChild(chipRow);
        scrollToBottom();
      }, 350);
    }
  }

  async function sendReply(value) {
    headerStatus.textContent = 'typing…';
    addTyping();
    try {
      const prompt = await api(`/chat/${sessionId}/reply`, {value});
      removeTyping();
      headerStatus.textContent = 'Online';
      renderServerPrompt(prompt);
    } catch (e) {
      headerStatus.textContent = 'Online';
      showError('Request failed: ' + e.message);
    }
  }

  async function init() {
    try {
      const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 3000));
      const data = await Promise.race([
        fetch(API_BASE + '/crops').then(r => r.json()),
        timeout,
      ]);
      if (data.crops && data.crops.length) allCrops = data.crops;
    } catch (e) { }
    askCrop();
  }

  init();
})();
</script>

</body>
</html>
